<!doctype html>
<html lang="en" class="dark" data-theme="vintage">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/map-icon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- browser bar color (android chrome, older ios). kept in sync with the mode in theme.ts -->
		<meta name="theme-color" content="#181410" />

		<!-- apply the saved light / dark mode before the page paints (see src/lib/theme.ts) -->
		<script>
			(function () {
				try {
					var saved = JSON.parse(localStorage.getItem('modeUserPrefers'));
					var light =
						typeof saved === 'boolean'
							? saved
							: window.matchMedia('(prefers-color-scheme: light)').matches;
					document.documentElement.classList.toggle('dark', !light);
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', light ? '#e3e3e3' : '#181410');
				} catch (e) {}
			})();
		</script>

		<!-- vercel web analytics + speed insights (the scripts only exist on vercel deployments) -->
		<script>
			window.va =
				window.va ||
				function () {
					(window.vaq = window.vaq || []).push(arguments);
				};
			window.si =
				window.si ||
				function () {
					(window.siq = window.siq || []).push(arguments);
				};
		</script>
		<script defer src="/_vercel/insights/script.js"></script>
		<script defer src="/_vercel/speed-insights/script.js"></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
